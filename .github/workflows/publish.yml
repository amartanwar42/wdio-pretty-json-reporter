name: Publish to npm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Build package
        run: npm run build
      
      - name: Bump version and publish
        run: |
          # Check if version in package.json has changed
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LAST_PUBLISHED=$(npm view wdio-pretty-json-reporter version 2>/dev/null || echo "0.0.0")
          
          if [ "$CURRENT_VERSION" != "$LAST_PUBLISHED" ]; then
            echo "Publishing version $CURRENT_VERSION (last published: $LAST_PUBLISHED)"
            npm publish
            
            # Create git tag and push
            git tag v$CURRENT_VERSION
            git push origin v$CURRENT_VERSION
          else
            echo "Version $CURRENT_VERSION already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

